<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notes Mini App</title>
  <style>
    :root { font: 15px/1.5 system-ui, sans-serif; background: #f5f6f8; color: #24252b; }
    body { max-width: 720px; margin: 8vh auto; padding: 0 24px; }
    h1 { margin-bottom: 0; }
    p { color: #69707e; }
    form { display: flex; gap: 8px; margin: 24px 0; }
    input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #cdd2dd; border-radius: 8px; }
    button { border: 0; border-radius: 8px; background: #4257d6; color: white; padding: 12px 18px; cursor: pointer; }
    li { margin: 10px 0; padding: 14px; border-radius: 8px; background: white; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Notes</h1>
  <p>This UI and its MCP tools are provided by an installed plugin.</p>
  <form id="new-note"><input id="text" maxlength="1000" placeholder="Write a note" required /><button type="submit">Add</button></form>
  <p id="status">Connecting…</p>
  <ul id="notes"></ul>
  <script>
    const channel = 'duya.plugin-app';
    let tools = [];
    function request(method, fields = {}) {
      return new Promise((resolve, reject) => {
        const id = crypto.randomUUID();
        const timer = setTimeout(() => { window.removeEventListener('message', receive); reject(new Error('App host timed out')); }, 30_000);
        function receive(event) {
          if (event.source !== window.parent || event.data?.channel !== channel || event.data?.id !== id) return;
          clearTimeout(timer); window.removeEventListener('message', receive);
          if (!event.data.ok) reject(new Error(event.data.result?.message || event.data.error || 'App host refused the request'));
          else resolve(event.data.result);
        }
        window.addEventListener('message', receive);
        window.parent.postMessage({ channel, id, method, ...fields }, '*');
      });
    }
    async function call(name, args = {}) {
      const tool = tools.find((item) => item.toolName === name);
      if (!tool) throw new Error(`Tool unavailable: ${name}`);
      const response = await request('invoke', { toolId: tool.toolId, arguments: args });
      if (response.error) throw new Error(response.result || 'MCP call failed');
      return response.structured || JSON.parse(response.result);
    }
    async function refresh() {
      const result = await call('notes_list');
      const list = document.getElementById('notes'); list.replaceChildren();
      for (const note of result.notes) { const item = document.createElement('li'); item.textContent = note.text; list.appendChild(item); }
      document.getElementById('status').textContent = `${result.notes.length} notes`;
    }
    document.getElementById('new-note').addEventListener('submit', async (event) => {
      event.preventDefault();
      const input = document.getElementById('text');
      try { await call('notes_add', { text: input.value }); input.value = ''; await refresh(); }
      catch (error) { document.getElementById('status').textContent = error.message; }
    });
    request('bind').then((binding) => { tools = binding.tools; return refresh(); })
      .catch((error) => { document.getElementById('status').textContent = error.message; });
  </script>
</body>
</html>
