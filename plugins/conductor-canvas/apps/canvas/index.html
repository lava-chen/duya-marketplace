<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conductor Canvas</title>
  <style>
    :root { color-scheme: light; font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #252627; background: #f5f5f2; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    .app { height: 100%; display: grid; grid-template-columns: 248px minmax(0, 1fr) 280px; }
    .sidebar { background: #fff; border-right: 1px solid #e8e8e4; display: flex; flex-direction: column; min-width: 0; }
    .brand { height: 58px; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; font-weight: 650; }
    .mark { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 7px; color: #fff; background: #5966e9; font-size: 15px; }
    .side-tools { display: flex; gap: 7px; padding: 12px; }
    .search { flex: 1; min-width: 0; border: 1px solid #e4e5e2; border-radius: 8px; padding: 7px 9px; outline: none; background: #fafaf9; }
    .search:focus, input:focus, textarea:focus { border-color: #828bea; box-shadow: 0 0 0 2px #5966e91c; outline: none; }
    .icon-btn, .btn { border: 1px solid #e1e2df; border-radius: 8px; background: #fff; cursor: pointer; }
    .icon-btn { width: 32px; height: 32px; font-size: 18px; }
    .btn { padding: 7px 10px; }
    .btn.primary { background: #5966e9; color: white; border-color: #5966e9; }
    .btn.danger { color: #bd3535; }
    .section-label { padding: 4px 16px 7px; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; color: #92938f; font-weight: 650; }
    .canvas-list { overflow: auto; padding: 0 8px 12px; }
    .canvas-row { width: 100%; text-align: left; border: 0; padding: 10px 9px; border-radius: 8px; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 9px; }
    .canvas-row:hover { background: #f5f5f2; }
    .canvas-row.active { background: #eeefff; color: #414dc4; }
    .canvas-dot { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; background: #eeeef0; color: #686a72; flex: none; }
    .canvas-row.active .canvas-dot { background: #dfe1ff; color: #5966e9; }
    .canvas-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .canvas-count { margin-left: auto; color: #9a9b98; font-size: 11px; }
    .footer { margin-top: auto; padding: 12px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 8px; color: #777974; font-size: 11px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #c1c3c0; }
    .status-dot.on { background: #36a469; }
    .workspace { display: flex; flex-direction: column; min-width: 0; }
    .toolbar { min-height: 58px; padding: 0 16px; display: flex; gap: 8px; align-items: center; background: #fff; border-bottom: 1px solid #e8e8e4; }
    .title-wrap { min-width: 0; flex: 1; }
    .title { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subtitle { font-size: 10px; color: #91928e; }
    .divider { width: 1px; height: 24px; background: #e9e9e5; margin: 0 2px; }
    .toolbar .btn { padding: 6px 9px; font-size: 12px; }
    .tool-select { height: 31px; border: 1px solid #e1e2df; border-radius: 8px; padding: 0 8px; background: #fff; }
    .board-wrap { flex: 1; min-height: 0; overflow: auto; padding: 34px; background-color: #f5f5f2; background-image: radial-gradient(#d5d6d2 1px, transparent 1px); background-size: 19px 19px; }
    .board { position: relative; width: min(100%, 1100px); min-width: 760px; aspect-ratio: 4 / 3; margin: 0 auto; background: #fff; border: 1px solid #e3e3df; border-radius: 10px; box-shadow: 0 10px 30px #0000000c; overflow: hidden; transform-origin: top center; }
    .board-grid { position: absolute; inset: 0; pointer-events: none; opacity: .65; background-image: linear-gradient(to right, #f3f3f0 1px, transparent 1px), linear-gradient(to bottom, #f3f3f0 1px, transparent 1px); background-size: 2.5% 3.3333%; }
    .connectors { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .group-frame { position: absolute; border: 1px dashed #9297ad; border-radius: 12px; background: #5966e908; color: #656a82; padding: 3px 8px; font-size: 10px; cursor: pointer; z-index: 0; }
    .group-frame.selected { outline: 2px solid #5966e9; }
    .element { position: absolute; min-width: 36px; min-height: 24px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; padding: 8px; border: 1px solid #deded8; border-radius: 8px; box-shadow: 0 2px 5px #0000000b; cursor: grab; user-select: none; font-size: clamp(9px, .9vw, 13px); white-space: pre-wrap; overflow-wrap: anywhere; }
    .element.selected { outline: 2px solid #5966e9; outline-offset: 2px; z-index: 999 !important; }
    .element.sticky, .element.shape { background: #fff2b8; }
    .element.text { background: #fff; border-color: transparent; box-shadow: none; }
    .element.document { background: #fff; }
    .element.table { background: #eef2ff; }
    .element.link { background: #e6f4ef; }
    .element.image, .element.file { background: #f0f0ee; }
    .element.widget { background: #f5eaff; }
    .element-title { font-weight: 650; margin-bottom: 4px; }
    .element-preview { color: #555; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .resize-handle { position: absolute; width: 10px; height: 10px; right: -4px; bottom: -4px; border-radius: 3px; background: #5966e9; border: 1px solid white; cursor: nwse-resize; }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; color: #999a96; text-align: center; pointer-events: none; }
    .right-panel { background: #fff; border-left: 1px solid #e8e8e4; display: flex; flex-direction: column; min-width: 0; }
    .panel-head { height: 58px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #eee; font-weight: 650; }
    .panel-body { padding: 15px; overflow: auto; }
    .field { display: grid; gap: 5px; margin: 0 0 13px; }
    .field label { color: #797a76; font-size: 11px; }
    .field input, .field textarea, .field select { width: 100%; padding: 8px; border: 1px solid #e2e3df; border-radius: 7px; background: #fff; resize: vertical; }
    .field textarea { min-height: 86px; }
    .coords { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .coords input { min-width: 0; }
    .swatches { display: flex; gap: 7px; }
    .swatch { width: 23px; height: 23px; border-radius: 50%; border: 1px solid #0002; cursor: pointer; }
    .muted { color: #959691; font-size: 11px; }
    .empty-detail { color: #989994; padding: 18px 3px; font-size: 12px; }
    .panel-actions { display: flex; gap: 7px; }
    .panel-actions .btn { flex: 1; }
    .app.presentation { grid-template-columns: minmax(0, 1fr); }
    .app.presentation .sidebar, .app.presentation .right-panel { display: none; }
    .element-table { width: 100%; border-collapse: collapse; font-size: 10px; background: #fff; }
    .element-table th, .element-table td { border: 1px solid #cbd2e7; padding: 2px 4px; text-align: left; }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; color: white; background: #292a2b; padding: 9px 13px; border-radius: 8px; transition: .18s; z-index: 10; max-width: 80vw; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .modal-backdrop { position: fixed; inset: 0; background: #1116; display: none; place-items: center; z-index: 20; }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(390px, calc(100vw - 30px)); border-radius: 12px; background: #fff; padding: 18px; box-shadow: 0 20px 70px #0003; }
    .modal h2 { margin: 0 0 15px; font-size: 15px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    @media (max-width: 980px) { .app { grid-template-columns: 205px minmax(0, 1fr); } .right-panel { display: none; } }
    @media (max-width: 640px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } .toolbar { padding: 0 9px; gap: 5px; } .toolbar .btn { padding: 6px; } .board-wrap { padding: 14px; } .board { min-width: 620px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="mark">◈</span><span>Conductor Canvas</span></div>
      <div class="side-tools"><input class="search" id="search" placeholder="搜索画布…" /><button class="icon-btn" id="newCanvas" title="新建画布">＋</button></div>
      <div class="side-tools" style="padding-top:0"><select class="search" id="groupFilter"><option value="">所有分组</option></select><button class="icon-btn" id="newGroup" title="新建分组">⊞</button></div>
      <div class="side-tools" style="padding-top:0"><button class="btn" id="favoritesOnly">☆ 收藏</button><select class="search" id="sortBy"><option value="updatedAt">最近更新</option><option value="name">名称</option><option value="createdAt">创建时间</option></select></div>
      <div class="section-label">我的画布 <span id="canvasCount"></span></div>
      <div class="canvas-list" id="canvasList"></div>
      <div class="footer"><span class="status-dot" id="statusDot"></span><button class="btn" id="statusText" title="点击重新连接">连接插件服务</button></div>
    </aside>
    <main class="workspace">
      <header class="toolbar">
        <div class="title-wrap"><div class="title" id="canvasTitle">Conductor Canvas</div><div class="subtitle" id="canvasSubtitle">插件 Mini App</div></div>
        <button class="btn" id="undo" title="撤销">↶</button><button class="btn" id="redo" title="重做">↷</button><button class="btn" id="importCanvas">导入</button><button class="btn" id="exportCanvas">导出</button><button class="btn" id="renameCanvas">重命名</button><button class="btn" id="deleteCanvas">删除画布</button><button class="btn" id="refresh">↻ 刷新</button><input id="importFile" type="file" accept="application/json,.json" hidden /><span class="divider"></span>
        <select class="tool-select" id="addKind" title="添加元素"><option value="shape">便笺</option><option value="text">文本</option><option value="document">文档</option><option value="table">表格</option><option value="link">链接</option><option value="image">图片</option><option value="file">文件</option></select>
        <button class="btn" id="autoLayout">自动排布</button><button class="btn" id="connectElements">连接所选</button><button class="btn" id="groupElements">组合</button><button class="btn primary" id="addElement">＋ 添加</button><button class="btn" id="presentation">演示</button>
        <span class="divider"></span><button class="btn" id="zoomOut">−</button><button class="btn" id="zoomIn">＋</button>
      </header>
      <section class="board-wrap" id="boardWrap"><div class="board" id="board"><div class="board-grid"></div><div class="empty" id="emptyState">连接插件服务以打开 Conductor 画布</div></div></section>
    </main>
    <aside class="right-panel">
      <div class="panel-head">属性</div>
      <div class="panel-body" id="inspector"><div class="empty-detail">选择一个画布元素以查看和编辑内容。</div></div>
    </aside>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">新建画布</h2><div class="field"><label for="modalName">名称</label><input id="modalName" maxlength="80" /></div><div class="field"><label for="modalDescription">描述</label><textarea id="modalDescription"></textarea></div><div class="modal-actions"><button class="btn" id="modalCancel">取消</button><button class="btn primary" id="modalSave">创建</button></div></div></div>
  <script>
  (function () {
    "use strict";
    var CHANNEL = "duya.plugin-app";
    var state = { bound: false, tools: [], canvases: [], groups: [], groupFilter: "", favoritesOnly: false, sortBy: "updatedAt", current: null, snapshot: null, selected: null, selectedIds: [], zoom: 1, dragging: null, search: "", modalMode: "create" };
    var $ = function (id) { return document.getElementById(id); };
    var board = $("board");
    function toast(message) { var node = $("toast"); node.textContent = message; node.classList.add("show"); clearTimeout(toast.timer); toast.timer = setTimeout(function () { node.classList.remove("show"); }, 2600); }
    function request(method, extra) {
      return new Promise(function (resolve, reject) {
        var id = "canvas-" + Math.random().toString(36).slice(2);
        var timer = setTimeout(function () { window.removeEventListener("message", receive); reject(new Error("Host 调用超时")); }, 45000);
        function receive(event) { var data = event.data; if (!data || data.channel !== CHANNEL || data.id !== id) return; clearTimeout(timer); window.removeEventListener("message", receive); if (data.ok === false) reject(new Error(data.result && data.result.message || data.error || "Host 调用失败")); else resolve(data); }
        window.addEventListener("message", receive);
        var message = { channel: CHANNEL, id: id, method: method };
        if (extra) Object.keys(extra).forEach(function (key) { message[key] = extra[key]; });
        window.parent.postMessage(message, "*");
      });
    }
    function unwrapTool(response) {
      var result = response && response.result;
      if (result && typeof result === "object" && result.result !== undefined) result = result.result;
      if (typeof result === "string") { try { return JSON.parse(result); } catch (_) { return result; } }
      return result;
    }
    async function callTool(toolName, args) {
      if (!state.bound) throw new Error("请先连接插件服务");
      var tool = state.tools.find(function (entry) { return entry.toolName === toolName; });
      if (!tool) throw new Error("插件未获此工具授权：" + toolName);
      var response = await request("invoke", { toolId: tool.toolId, arguments: args || {} });
      if (!response.ok) throw new Error(response.error || (response.message || "Canvas 工具调用失败"));
      var result = response.result || {};
      if (result.error) throw new Error(typeof result.result === "string" ? result.result : "Canvas 工具调用失败");
      return unwrapTool(result);
    }
    async function primeFreshness() { if (state.current) await callTool("canvas_list_elements", { canvasId: state.current.id }); }
    async function connect() {
      var status = $("statusText"); status.textContent = "正在连接…";
      try {
        var result = await request("bind"); if (!result.ok) throw new Error(result.error || "无法连接插件服务");
        state.bound = true; state.tools = result.result && Array.isArray(result.result.tools) ? result.result.tools : []; $("statusDot").classList.add("on"); status.textContent = "插件服务已连接";
        await refreshCanvases(); toast("已连接 Conductor Canvas");
      } catch (error) { state.bound = false; $("statusDot").classList.remove("on"); status.textContent = "连接失败 · 重试"; toast(String(error.message || error)); }
    }
    async function refreshCanvases() {
      var result = await callTool("canvas_manage", { action: "list" });
      state.canvases = Array.isArray(result && result.canvases) ? result.canvases : [];
      var groupResult = await callTool("canvas_group_list", {});
      state.groups = Array.isArray(groupResult && groupResult.groups) ? groupResult.groups : [];
      var groupSelect = $("groupFilter"); var selectedGroup = state.groupFilter; groupSelect.replaceChildren(new Option("所有分组", ""));
      state.groups.forEach(function (group) { groupSelect.add(new Option(group.name, group.id)); }); groupSelect.value = selectedGroup;
      var current = await callTool("canvas_manage", { action: "get_current" });
      state.current = current && current.currentCanvas || null;
      if (!state.current && state.canvases.length) state.current = state.canvases[0];
      renderCanvasList();
      if (state.current) { await loadSnapshot(); } else { state.snapshot = null; renderBoard(); }
    }
    async function loadSnapshot() {
      if (!state.current) return;
      await primeFreshness();
      var data = await callTool("canvas_get_snapshot", { canvasId: state.current.id });
      state.snapshot = data && data.canvas ? data : data && data.result && data.result.canvas ? data.result : null;
      $("canvasTitle").textContent = state.current.name || (state.snapshot && state.snapshot.canvas.name) || "未命名画布";
      $("canvasSubtitle").textContent = state.snapshot ? (state.snapshot.elements || []).length + " 个元素 · 40 × 30 网格" : "等待画布数据";
      state.selected = null; state.selectedIds = []; renderCanvasList(); renderBoard(); renderInspector();
    }
    function renderCanvasList() {
      var query = state.search.toLowerCase();
      var list = state.canvases.filter(function (canvas) { return (!query || String(canvas.name || "").toLowerCase().includes(query)) && (!state.groupFilter || canvas.groupId === state.groupFilter) && (!state.favoritesOnly || canvas.isFavorite); });
      list.sort(function (a, b) { if (state.sortBy === "name") return String(a.name).localeCompare(String(b.name)); return String(b[state.sortBy] || "").localeCompare(String(a[state.sortBy] || "")); });
      $("canvasCount").textContent = "(" + state.canvases.length + ")";
      var root = $("canvasList"); root.replaceChildren();
      if (!list.length) { var empty = document.createElement("div"); empty.className = "empty-detail"; empty.textContent = state.canvases.length ? "没有匹配的画布" : "暂无画布"; root.appendChild(empty); return; }
      list.forEach(function (canvas) {
        var row = document.createElement("button"); row.className = "canvas-row" + (state.current && state.current.id === canvas.id ? " active" : "");
        var dot = document.createElement("span"); dot.className = "canvas-dot"; dot.textContent = "▤";
        var name = document.createElement("span"); name.className = "canvas-name"; name.textContent = canvas.name || "未命名画布";
        var marker = document.createElement("span"); marker.className = "canvas-count"; marker.textContent = (canvas.isFavorite ? "★ " : "") + (canvas.elementCount || "");
        row.append(dot, name, marker);
        row.addEventListener("click", function () { switchCanvas(canvas); });
        root.appendChild(row);
      });
    }
    async function switchCanvas(canvas) {
      try { await callTool("canvas_manage", { action: "switch", canvasId: canvas.id }); state.current = canvas; await loadSnapshot(); }
      catch (error) { toast(String(error.message || error)); }
    }
    function textFromConfig(config) {
      if (!config) return "";
      return config.text || config.title || config.markdown || config.label || config.fileName || config.url || "";
    }
    function renderBoard() {
      Array.prototype.slice.call(board.querySelectorAll(".element,.empty,.connectors,.group-frame")).forEach(function (node) { node.remove(); });
      var elements = state.snapshot && Array.isArray(state.snapshot.elements) ? state.snapshot.elements : [];
      var byId = new Map(elements.map(function (item) { return [item.id, item]; }));
      if (!state.bound || !state.current) { var hint = document.createElement("div"); hint.className = "empty"; hint.textContent = "连接插件服务以打开 Conductor 画布"; board.appendChild(hint); return; }
      if (!elements.length) { var empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "画布还是空的。点击“添加”开始构建。"; board.appendChild(empty); }
      elements.filter(function (item) { return item.type === "group"; }).forEach(function (group) {
        var members = (group.config && group.config.memberIds || []).map(function (id) { return byId.get(id); }).filter(Boolean); if (!members.length) return;
        var bounds = { x: Math.min.apply(null, members.map(function (item) { return item.position.x; })) - .3, y: Math.min.apply(null, members.map(function (item) { return item.position.y; })) - .6, right: Math.max.apply(null, members.map(function (item) { return item.position.x + item.position.w; })) + .3, bottom: Math.max.apply(null, members.map(function (item) { return item.position.y + item.position.h; })) + .3 };
        var frame = document.createElement("div"); frame.className = "group-frame" + (state.selectedIds.includes(group.id) ? " selected" : ""); frame.textContent = group.config.name || "Group"; frame.style.left = (Math.max(0, bounds.x) / 40 * 100) + "%"; frame.style.top = (Math.max(0, bounds.y) / 30 * 100) + "%"; frame.style.width = ((bounds.right - Math.max(0, bounds.x)) / 40 * 100) + "%"; frame.style.height = ((bounds.bottom - Math.max(0, bounds.y)) / 30 * 100) + "%"; frame.addEventListener("click", function (event) { event.stopPropagation(); state.selected = group; state.selectedIds = [group.id]; renderBoard(); renderInspector(); }); board.appendChild(frame);
      });
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "connectors"); svg.setAttribute("viewBox", "0 0 1000 750");
      elements.filter(function (item) { return item.type === "connector"; }).forEach(function (connector) {
        var config = connector.config || {}; var from = byId.get(config.sourceId); var to = byId.get(config.targetId); if (!from || !to) return;
        var a = from.position || {}; var b = to.position || {}; var x1 = ((Number(a.x) || 0) + (Number(a.w) || 0) / 2) * 25; var y1 = ((Number(a.y) || 0) + (Number(a.h) || 0) / 2) * 25; var x2 = ((Number(b.x) || 0) + (Number(b.w) || 0) / 2) * 25; var y2 = ((Number(b.y) || 0) + (Number(b.h) || 0) / 2) * 25;
        var line = document.createElementNS("http://www.w3.org/2000/svg", "line"); line.setAttribute("x1", x1); line.setAttribute("y1", y1); line.setAttribute("x2", x2); line.setAttribute("y2", y2); line.setAttribute("stroke", "#767982"); line.setAttribute("stroke-width", "2"); svg.appendChild(line);
        if (config.label) { var label = document.createElementNS("http://www.w3.org/2000/svg", "text"); label.setAttribute("x", (x1 + x2) / 2); label.setAttribute("y", (y1 + y2) / 2 - 5); label.setAttribute("text-anchor", "middle"); label.setAttribute("font-size", "13"); label.setAttribute("fill", "#555"); label.textContent = config.label; svg.appendChild(label); }
      }); board.appendChild(svg);
      elements.forEach(function (element) {
        if (element.type === "connector" || element.type === "group") return;
        var pos = element.position || {}; var kind = String(element.type || element.elementKind || "").split("/").pop();
        var node = document.createElement("div"); node.className = "element " + kind + (state.selectedIds.includes(element.id) ? " selected" : "");
        node.dataset.id = element.id;
        node.style.left = ((Number(pos.x) || 0) / 40 * 100) + "%";
        node.style.top = ((Number(pos.y) || 0) / 30 * 100) + "%";
        node.style.width = (Math.max(1, Number(pos.w) || 3) / 40 * 100) + "%";
        node.style.height = (Math.max(.8, Number(pos.h) || 2) / 30 * 100) + "%";
        node.style.zIndex = String(Number(pos.zIndex) || 1);
        var config = element.config || {};
        var colorMap = { yellow: "#fff2b8", blue: "#cfe5ff", green: "#d5efd9", pink: "#ffd9dd", purple: "#e8dcff", gray: "#e6e7e4" };
        if (config.bgColor) node.style.backgroundColor = config.bgColor; else if (colorMap[config.color]) node.style.backgroundColor = colorMap[config.color];
        var title = document.createElement("div"); title.className = "element-title"; title.textContent = config.title || config.fileName || (kind === "shape" ? "便笺" : kind);
        var preview = document.createElement("div"); preview.className = "element-preview"; preview.textContent = textFromConfig(config);
        node.append(title, preview);
        if (kind === "table" && Array.isArray(config.headers)) {
          preview.remove();
          var table = document.createElement("table"); table.className = "element-table";
          var thead = document.createElement("thead"); var headerRow = document.createElement("tr");
